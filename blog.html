---
layout: default
title: Blog Archive
permalink: /blog/
---

<div class="archive-head">
  <h1>Blog Archive</h1>
  <form id="archive-search" class="archive-search" role="search">
    <input type="search" id="archive-search-input" class="search-input" placeholder="Search" enterkeyhint="search" autocomplete="off" aria-label="Search the blog">
  </form>
</div>

<p id="archive-empty" class="search-empty" hidden>Nothing found.</p>

<ul class="archive-list">
  {% for post in site.posts %}
  <li class="archive-item" data-url="{{ post.url | relative_url }}">
    <div class="archive-main">
      <a href="{{ post.url | relative_url }}" class="archive-title">{{ post.title }}</a>
    </div>
    <time class="archive-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %d, %Y" }}</time>  </li>
  {% endfor %}
</ul>

<script>
(function () {
  var form = document.getElementById('archive-search');
  var input = document.getElementById('archive-search-input');
  var empty = document.getElementById('archive-empty');
  var items = document.querySelectorAll('.archive-item');
  var index = null;
  var failed = false;

  function plain(s) {
    return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function snippet(content, words) {
    var text = String(content).normalize('NFC');
    var flat = plain(text);
    var first = -1;
    words.forEach(function (w) {
      var i = flat.indexOf(w);
      if (i !== -1 && (first === -1 || i < first)) first = i;
    });
    if (first === -1) return '';
    var start = Math.max(0, first - 30);
    var end = Math.min(text.length, first + 160);
    var hits = [];
    words.forEach(function (w) {
      var i = flat.indexOf(w, start);
      while (i !== -1 && i < end) {
        hits.push([i, i + w.length]);
        i = flat.indexOf(w, i + w.length);
      }
    });
    hits.sort(function (a, b) { return a[0] - b[0]; });
    var html = '';
    var pos = start;
    hits.forEach(function (h) {
      if (h[0] < pos) return;
      html += esc(text.slice(pos, h[0])) + '<mark>' + esc(text.slice(h[0], Math.min(h[1], end))) + '</mark>';
      pos = Math.min(h[1], end);
    });
    html += esc(text.slice(pos, end));
    return (start > 0 ? '\u2026' : '') + html + (end < text.length ? '\u2026' : '');
  }

  function setSnippet(li, html) {
    var el = li.querySelector('.archive-preview');
    if (!html) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('span');
      el.className = 'archive-preview';
      li.querySelector('.archive-main').appendChild(el);
    }
    el.innerHTML = html;
  }

  function showAll() {
    items.forEach(function (li) { li.style.display = ''; setSnippet(li, ''); });
    empty.hidden = true;
  }

  function run() {
    var words = plain(input.value).split(/\s+/).filter(function (w) { return w.length > 0; });
    if (words.length === 0) { showAll(); return; }

    if (!index) {
      empty.textContent = failed ? 'Search could not load.' : 'Search is still loading, press Enter again.';
      empty.hidden = false;
      return;
    }
    empty.textContent = 'Nothing found.';

    var shown = 0;
    items.forEach(function (li) {
      var post = index[li.getAttribute('data-url')];
      var text = post ? plain(post.title + ' ' + post.content) : plain(li.textContent);
      var ok = words.every(function (w) { return text.indexOf(w) !== -1; });
      li.style.display = ok ? '' : 'none';
      setSnippet(li, ok && post ? snippet(post.content, words) : '');
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
  }

  fetch('{{ "/search.json" | relative_url }}')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      index = {};
      data.forEach(function (p) { index[p.url] = p; });
    })
    .catch(function () { failed = true; });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    run();
    input.blur();
  });

  input.addEventListener('input', function () {
    if (input.value.trim() === '') showAll();
  });
})();
</script>
