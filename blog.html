---
layout: default
title: Blog Archive
permalink: /blog/
---

<div class="archive-head">
  <h1>Blog Archive</h1>
  <form id="archive-search" class="archive-search" role="search">
    <input type="search" id="archive-search-input" class="search-input" placeholder="Search" enterkeyhint="search" autocomplete="off" aria-label="Search the blog">
  </form>
  <p id="archive-count" class="archive-count" hidden></p>
</div>

<ul class="archive-list">
  {% for post in site.posts %}
  <li class="archive-item" data-url="{{ post.url | relative_url }}">
    <div class="archive-main">
      <a href="{{ post.url | relative_url }}" class="archive-title">{{ post.title }}</a>
    </div>
    <time class="archive-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %d, %Y" }}</time>  </li>
  {% endfor %}
</ul>

<script>
(function () {
  var form = document.getElementById('archive-search');
  var input = document.getElementById('archive-search-input');
  var count = document.getElementById('archive-count');
  var items = document.querySelectorAll('.archive-item');
  var index = null;
  var failed = false;

  function plain(s) {
    return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function countIn(str, words) {
    var flat = plain(String(str).normalize('NFC'));
    var n = 0;
    words.forEach(function (w) {
      var i = flat.indexOf(w);
      while (i !== -1) {
        n++;
        i = flat.indexOf(w, i + w.length);
      }
    });
    return n;
  }

  var MAX_LINES = 10000;

  function markTitle(title, words) {
    var text = String(title).normalize('NFC');
    var flat = plain(text);
    var hits = [];
    words.forEach(function (w) {
      var i = flat.indexOf(w);
      while (i !== -1) {
        hits.push([i, i + w.length]);
        i = flat.indexOf(w, i + w.length);
      }
    });
    hits.sort(function (a, b) { return a[0] - b[0]; });
    var out = '';
    var pos = 0;
    hits.forEach(function (h) {
      if (h[0] < pos) return;
      out += esc(text.slice(pos, h[0])) + '<mark>' + esc(text.slice(h[0], h[1])) + '</mark>';
      pos = h[1];
    });
    return out + esc(text.slice(pos));
  }

  // ⟦ and ⟧ wrap text that is code in the post (see search.json)
  function codeHtml(s) {
    return s.replace(/⟦/g, '<code>').replace(/⟧/g, '</code>');
  }

  function lines(content, words) {
    var text = String(content).normalize('NFC');
    var flat = plain(text);
    var hits = [];
    words.forEach(function (w) {
      var i = flat.indexOf(w);
      while (i !== -1) {
        hits.push([i, i + w.length]);
        i = flat.indexOf(w, i + w.length);
      }
    });
    hits.sort(function (a, b) { return a[0] - b[0]; });

    var wins = [];
    var covered = -1;
    hits.forEach(function (h) {
      var start = Math.max(0, h[0] - 30);
      var end = Math.min(text.length, h[0] + 160);
      wins.push([start, end]);
      covered = end;
    });

    var html = wins.slice(0, MAX_LINES).map(function (win) {
      var start = win[0], end = win[1];
      var out = '';
      var pos = start;
      hits.forEach(function (h) {
        if (h[0] < pos || h[0] >= end) return;
        var stop = Math.min(h[1], end);
        out += esc(text.slice(pos, h[0])) + '<mark>' + esc(text.slice(h[0], stop)) + '</mark>';
        pos = stop;
      });
      out += esc(text.slice(pos, end));
      var before = text.slice(0, start);
      var inCode = before.lastIndexOf('⟦') > before.lastIndexOf('⟧');
      out = codeHtml((inCode ? '⟦' : '') + out);
      return (start > 0 ? '\u2026' : '') + out + (end < text.length ? '\u2026' : '');
    });

    var more = wins.length - html.length;
    if (more > 0) html.push('+ ' + more + ' more');
    return html;
  }

  function setSnippet(li, list) {
    var main = li.querySelector('.archive-main');
    main.querySelectorAll('.archive-preview').forEach(function (el) { el.remove(); });
    (list || []).forEach(function (html) {
      var el = document.createElement('span');
      el.className = 'archive-preview';
      el.innerHTML = html;
      main.appendChild(el);
    });
  }

  function setTitle(li, words) {
    var a = li.querySelector('.archive-title');
    if (!a.hasAttribute('data-title')) a.setAttribute('data-title', a.textContent);
    var t = a.getAttribute('data-title');
    if (words) a.innerHTML = markTitle(t, words); else a.textContent = t;
  }

  function showAll() {
    items.forEach(function (li) { li.style.display = ''; setSnippet(li, null); setTitle(li, null); });
    count.hidden = true;
  }

  function run() {
    // the whole query is one phrase: words must appear together, in this order
    var phrase = plain(input.value).split(/\s+/).filter(function (w) { return w.length > 0; }).join(' ');
    var words = phrase ? [phrase] : [];
    if (words.length === 0) { showAll(); return; }

    if (!index) {
      count.textContent = failed ? 'Search could not load.' : 'Search is still loading, press Enter again.';
      count.hidden = false;
      return;
    }

    var shown = 0;
    var total = 0;
    items.forEach(function (li) {
      var post = index[li.getAttribute('data-url')];
      var text = post ? plain(post.title + ' ' + post.content) : plain(li.textContent);
      var ok = words.every(function (w) { return text.indexOf(w) !== -1; });
      li.style.display = ok ? '' : 'none';
      setSnippet(li, ok && post ? lines(post.content, words) : null);
      setTitle(li, ok ? words : null);
      if (ok) {
        shown++;
        if (post) total += countIn(post.title, words) + countIn(post.content, words);
      }
    });
    count.hidden = false;
    count.textContent = shown === 0
      ? 'Nothing found.'
      : shown + (shown === 1 ? ' post' : ' posts') + ' \u00b7 ' + total + (total === 1 ? ' match' : ' matches');
  }

  fetch('{{ "/search.json" | relative_url }}')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      index = {};
      data.forEach(function (p) { index[p.url] = p; });
    })
    .catch(function () { failed = true; });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    run();
    input.blur();
  });

  input.addEventListener('input', function () {
    if (input.value.trim() === '') showAll();
  });
})();
</script>
