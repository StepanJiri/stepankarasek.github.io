<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav">
      <!-- Blog is only active when you're actually on /blog/ or reading a post, NOT on the homepage -->
      <a href="{{ '/blog/' | relative_url }}"
         class="nav-link {% if page.url contains '/blog' or page.layout == 'post' %}active{% endif %}">Blog</a>

      <a href="{{ '/about/' | relative_url }}"
         class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a>

      <a href="https://jirka-karasek.itch.io" class="nav-link nav-link-external" target="_blank" rel="noopener">
        Games <span class="external-icon" aria-hidden="true">&#8599;</span>
      </a>
      <a href="https://www.youtube.com/@RubiconRevisited" class="nav-link nav-link-external" target="_blank" rel="noopener">
        Videos <span class="external-icon" aria-hidden="true">&#8599;</span>
      </a>
      <a href="https://mastodon.social/@yourusername" class="nav-link nav-link-external" target="_blank" rel="noopener">
        Mastodon <span class="external-icon" aria-hidden="true">&#8599;</span>
      </a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} • <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
