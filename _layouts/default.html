<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a class="site-brand {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">{{ site.title }}</a>

      <nav class="site-nav">
        <a href="{{ '/blog/' | relative_url }}"
           class="nav-link {% if page.url contains '/blog' or page.layout == 'post' %}active{% endif %}">Blog</a>

        <a href="{{ '/about/' | relative_url }}"
           class="nav-link {% if page.url contains '/about' %}active{% endif %}">About Me</a>
      </nav>
    </div>

   <div class="header-right">
  <a href="https://mastodon.social/@StepanJiriKarasek" class="nav-link nav-link-external" target="_blank" rel="noopener">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.58 8.67c0-4.4-2.89-5.7-2.89-5.7-1.46-.67-3.98-.95-6.6-.97h-.06c-2.61.02-5.13.3-6.6.97 0 0-2.88 1.3-2.88 5.7 0 1.01-.02 2.22.01 3.5.1 4.32.76 8.58 4.61 9.6 1.78.47 3.3.57 4.53.5 2.23-.13 3.48-.8 3.48-.8l-.07-1.6s-1.59.5-3.38.44c-1.77-.06-3.64-.2-3.93-2.42a4.6 4.6 0 0 1-.04-.6s1.76.43 3.98.53c1.36.06 2.63-.08 3.92-.24 2.48-.3 4.64-1.85 4.91-3.27.42-2.25.39-5.5.39-5.5zm-3.29 5.44h-2.04v-4.98c0-1.05-.44-1.58-1.32-1.58-.97 0-1.46.63-1.46 1.87v2.7h-2.03v-2.7c0-1.24-.49-1.87-1.46-1.87-.88 0-1.32.53-1.32 1.58v4.98H6.62V8.94c0-1.05.27-1.88.8-2.5.55-.62 1.28-.94 2.17-.94 1.04 0 1.82.4 2.35 1.2l.5.86.5-.86c.53-.8 1.31-1.2 2.35-1.2.9 0 1.62.32 2.17.94.53.62.8 1.45.8 2.5v5.17z"/></svg>
    <span class="nav-text">Mastodon</span>
  </a>
  <a href="{{ '/youtube/' | relative_url }}" class="nav-link nav-link-external" target="_blank" rel="noopener">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    <span class="nav-text">Videos</span>
  </a>
  <a href="{{ '/podcast/' | relative_url }}" class="nav-link nav-link-external" target="_blank" rel="noopener">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <span class="nav-text">Podcast</span>
  </a>
  <a href="https://jirka-karasek.itch.io" class="nav-link nav-link-external" target="_blank" rel="noopener">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 7h-11C4.67 7 3 8.9 3 11.25 3 13 4 15 5.2 15c.8 0 1.13-.5 2.02-1.5.4-.45.85-.75 1.28-.75s.88.3 1.28.75c.4.45.9.75 1.22.75s.82-.3 1.22-.75c.4-.45.85-.75 1.28-.75s.88.3 1.28.75c.89 1 1.22 1.5 2.02 1.5C19 15 20 13 20 11.25 20 8.9 18.33 7 17.5 7zM9 10.5h-1v1H7v-1H6v-1h1v-1h1v1h1v1zm5.75.75a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5zm2-2a.75.75 0 1 1 0-1.5.75.75 0 0 1 0 1.5z"/></svg>
    <span class="nav-text">Games</span>
  </a>
</div>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    {% unless page.hide_rss %}
    <p><a href="{{ '/feed.xml' | relative_url }}" class="footer-rss">RSS</a></p>
    {% endunless %}
  </footer>
</body>
</html>
