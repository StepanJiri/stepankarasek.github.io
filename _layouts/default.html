<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page-wrap">
    <aside class="sidebar">
      <a class="site-brand {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">{{ site.title }}</a>

      <nav class="sidebar-nav">
        <a href="{{ '/blog/' | relative_url }}"
           class="nav-link {% if page.url contains '/blog' or page.layout == 'post' %}active{% endif %}">Blog Archive</a>

        <a href="{{ '/about/' | relative_url }}"
           class="nav-link {% if page.url contains '/about' %}active{% endif %}">About Me</a>

        <div class="sidebar-divider"></div>

        <a href="https://mastodon.social/@StepanJiriKarasek" class="nav-link nav-caps" target="_blank" rel="noopener">Mastodon</a>
        <a href="{{ '/youtube/' | relative_url }}" class="nav-link nav-caps" target="_blank" rel="noopener">Videos</a>
        <a href="{{ '/podcast/' | relative_url }}" class="nav-link nav-caps" target="_blank" rel="noopener">Podcast</a>
        <a href="https://jirka-karasek.itch.io" class="nav-link nav-caps" target="_blank" rel="noopener">Games</a>
      </nav>
    </aside>

    <main>
      {{ content }}
    </main>
  </div>

  <script data-goatcounter="https://rubicon.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
