<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <nav class="site-nav">
      <a href="{{ '/blog/' | relative_url }}"
         class="nav-link {% if page.url contains '/blog' or page.layout == 'post' %}active{% endif %}">Blog</a>

      <a href="{{ '/about/' | relative_url }}"
         class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a>

      <span class="nav-divider" aria-hidden="true"></span>

      <a href="https://mastodon.social/@StepanJiriKarasek" class="nav-link nav-link-external" target="_blank" rel="noopener">Mastodon</a>      
      <a href="https://www.youtube.com/@RubiconRevisited" class="nav-link nav-link-external" target="_blank" rel="noopener">Videos</a>
      <a href="https://rss.com/podcasts/test-pod734/" class="nav-link nav-link-external" target="_blank" rel="noopener">Podcast</a>
      <a href="https://jirka-karasek.itch.io" class="nav-link nav-link-external" target="_blank" rel="noopener">Games</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} • <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
</body>
</html>
