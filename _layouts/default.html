<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <!-- Blog Link (Active on root /, /blog/, or post layout) -->
      <a href="{{ '/blog/' | relative_url }}" 
         class="nav-link {% if page.url == '/' or page.url contains '/blog' or page.layout == 'post' %}active{% endif %}">Blog</a>

      <!-- About Link (Active on /about/) -->
      <a href="{{ '/about/' | relative_url }}" 
         class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a>

      <!-- External Links -->
      <a href="https://jirka-karasek.itch.io" class="nav-link">Games</a>
      <a href="https://www.youtube.com/@RubiconRevisited" class="nav-link">Videos</a>
      <a href="https://mastodon.social/@yourusername" class="nav-link">Mastodon</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</p>
  </footer>
</body>
</html>
