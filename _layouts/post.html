---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <p class="post-back">
    <a href="{{ '/blog/' | relative_url }}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="post-back-icon">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>Blog Archive
    </a>
  </p>
</article>
