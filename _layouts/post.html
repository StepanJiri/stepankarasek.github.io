---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <p class="post-back">
    <a href="{{ '/blog/' | relative_url }}">Blog Archive</a>
  </p>
</article>
