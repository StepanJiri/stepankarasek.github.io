---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Blog Archive</a></p>

  <div id="post-links" class="post-links"></div>
</article>

<script>
(function () {
  var content = document.getElementById('post-content');
  var container = document.getElementById('post-links');
  if (!content || !container) return;

  var anchors = content.querySelectorAll('a[href^="http"]');
  var seen = {};
  var links = [];

  anchors.forEach(function (a) {
    var href = a.getAttribute('href');
    if (!seen[href]) {
      seen[href] = true;
      var customLabel = a.getAttribute('title');
      var label = (customLabel && customLabel.trim()) ? customLabel.trim() : (a.textContent.trim() || href);
      links.push({ href: href, label: label });
    }
  });

  if (links.length === 0) return;

  var label = document.createElement('p');
  label.className = 'post-links-label';
  label.textContent = 'Links in this article';
  container.appendChild(label);

  var list = document.createElement('ul');
  list.className = 'post-links-list';

  links.forEach(function (link) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = link.href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.title = link.href;
    a.dataset.label = link.label;
    a.textContent = link.label;
    li.appendChild(a);
    list.appendChild(li);
  });

  container.appendChild(list);

  var linkEls = list.querySelectorAll('a');

  function showUrls() {
    linkEls.forEach(function (a) {
      a.textContent = a.getAttribute('href');
    });
  }

  function showLabels() {
    linkEls.forEach(function (a) {
      a.textContent = a.dataset.label;
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Control' || e.key === 'Meta') showUrls();
  });

  document.addEventListener('keyup', function (e) {
    if (e.key === 'Control' || e.key === 'Meta') showLabels();
  });

  window.addEventListener('blur', showLabels);
})();
</script>
