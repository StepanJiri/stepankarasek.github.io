---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <div id="post-links" class="post-links"></div>

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a></p>
</article>

<script>
(function () {
  var content = document.getElementById('post-content');
  var container = document.getElementById('post-links');
  if (!content || !container) return;

  var anchors = content.querySelectorAll('a[href^="http"]');
  var seen = {};
  var links = [];

  anchors.forEach(function (a) {
    var href = a.getAttribute('href');
    if (!seen[href]) {
      seen[href] = true;
      links.push({ href: href, text: a.textContent.trim() || href });
    }
  });

  if (links.length === 0) return;

  var html = '<p class="post-links-label">Links in this article</p><ul class="post-links-list">';
  links.forEach(function (link) {
    html += '<li><a href="' + link.href + '" target="_blank" rel="noopener">' + link.text + '</a></li>';
  });
  html += '</ul>';

  container.innerHTML = html;
})();
</script>
