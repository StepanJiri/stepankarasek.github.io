---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Blog Archive</a></p>

  <p class="post-links-reveal" id="post-links-reveal" style="display:none;">
    <a href="#" id="post-links-reveal-link">Show links</a>
  </p>

  <div id="post-links" class="post-links" hidden></div>
</article>

<script>
(function () {
  var content = document.getElementById('post-content');
  var container = document.getElementById('post-links');
  var revealWrap = document.getElementById('post-links-reveal');
  var revealLink = document.getElementById('post-links-reveal-link');
  if (!content || !container || !revealWrap || !revealLink) return;

  var anchors = content.querySelectorAll('a[href^="http"]');
  var seen = {};
  var links = [];

  anchors.forEach(function (a) {
    var href = a.getAttribute('href');
    var customLabel = a.getAttribute('title');
    var label = (customLabel && customLabel.trim()) ? customLabel.trim() : (a.textContent.trim() || href);

    if (customLabel) {
      a.removeAttribute('title');
    }

    // Always show the link's full URL in small text right after it.
    var urlSpan = document.createElement('span');
    urlSpan.className = 'inline-url';
    urlSpan.textContent = ' (' + href + ')';
    a.insertAdjacentElement('afterend', urlSpan);

    if (!seen[href]) {
      seen[href] = true;
      links.push({ href: href, label: label });
    }
  });

  if (links.length === 0) return;

  revealWrap.style.display = '';

  var heading = document.createElement('p');
  heading.className = 'post-links-label';
  heading.textContent = 'Links in this post';
  container.appendChild(heading);

  var list = document.createElement('ul');
  list.className = 'post-links-list';

  links.forEach(function (link) {
    var li = document.createElement('li');

    var a = document.createElement('a');
    a.href = link.href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = link.label;
    li.appendChild(a);

    var urlLine = document.createElement('span');
    urlLine.className = 'post-links-url';
    urlLine.textContent = link.href;
    li.appendChild(urlLine);

    list.appendChild(li);
  });

  container.appendChild(list);

  revealLink.addEventListener('click', function (e) {
    e.preventDefault();
    container.removeAttribute('hidden');
    revealWrap.style.display = 'none';
  });
})();
</script>
