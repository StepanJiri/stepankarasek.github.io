---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  <div class="post-content" id="post-content">
    {{ content }}
  </div>

  <div class="post-footer-row">
    <a href="{{ '/blog/' | relative_url }}" class="post-back">&larr; Blog Archive</a>
    <button type="button" id="post-links-toggle" class="post-links-toggle" aria-expanded="false" aria-controls="post-links" aria-label="Show links in this post" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"></path>
        <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"></path>
      </svg>
    </button>
  </div>

  <div id="post-links" class="post-links" hidden></div>
</article>

<script>
(function () {
  var content = document.getElementById('post-content');
  var container = document.getElementById('post-links');
  var toggle = document.getElementById('post-links-toggle');
  if (!content || !container || !toggle) return;

  function addFastTip(a, text) {
    if (!text) return;
    a.dataset.tip = text;
    a.classList.add('has-tip');
  }

  var anchors = content.querySelectorAll('a[href^="http"]');
  var seen = {};
  var links = [];

  anchors.forEach(function (a) {
    var href = a.getAttribute('href');
    var customLabel = a.getAttribute('title');
    var label = (customLabel && customLabel.trim()) ? customLabel.trim() : (a.textContent.trim() || href);

    // Replace the slow native tooltip with a fast custom one.
    if (customLabel) {
      a.removeAttribute('title');
      addFastTip(a, customLabel.trim());
    }

    if (!seen[href]) {
      seen[href] = true;
      links.push({ href: href, label: label });
    }
  });

  if (links.length === 0) return;

  toggle.style.display = '';

  var heading = document.createElement('p');
  heading.className = 'post-links-label';
  heading.textContent = 'Links in this post';
  container.appendChild(heading);

  var list = document.createElement('ul');
  list.className = 'post-links-list';

  links.forEach(function (link) {
    var li = document.createElement('li');

    var a = document.createElement('a');
    a.href = link.href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = link.label;
    addFastTip(a, link.href);
    li.appendChild(a);

    var urlLine = document.createElement('span');
    urlLine.className = 'post-links-url';
    urlLine.textContent = link.href;
    li.appendChild(urlLine);

    list.appendChild(li);
  });

  container.appendChild(list);

  toggle.addEventListener('click', function () {
    var isHidden = container.hasAttribute('hidden');
    if (isHidden) {
      container.removeAttribute('hidden');
      toggle.setAttribute('aria-expanded', 'true');
      toggle.classList.add('is-open');
    } else {
      container.setAttribute('hidden', '');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.classList.remove('is-open');
    }
  });
})();
</script>
