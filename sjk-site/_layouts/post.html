---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}</p>
  </header>

  {% if page.image %}
  <img class="post-image" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; Back to blog</a></p>
</article>
