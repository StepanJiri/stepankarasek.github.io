<style>
:root {
--bg: #ffffff;
--fg: #111111;
--muted: #666666;
--accent: #ff7300;
--border: #e5e5e5;
--card-bg: #f7f7f7;
}

@media (prefers-color-scheme: dark) {

--bg: #000000;
--fg: #f2f2f2;
--muted: #999999;
--accent: #ff9640;
--border: #222222;
--card-bg: #151515;
}
}

* { box-sizing: border-box; }

body {
margin: 0;
background: var(--bg);
color: var(--fg);
font-family: Verdana, Geneva, sans-serif;
line-height: 1.6;
display: flex;
justify-content: center;
}

.start-wrap {
width: 100%;
max-width: 420px;
padding: 3rem 1.5rem 2.5rem;
text-align: center;
}

.start-brand {
font-weight: 700;
font-size: 1.3rem;
text-decoration: none;
color: var(--fg);
display: block;
margin-bottom: 0.4rem;
}

.start-tagline {
color: var(--muted);
font-size: 0.9rem;
margin: 0 0 2rem 0;
}

.start-links {
display: flex;
flex-direction: column;
gap: 0.85rem;
}

.start-link {
display: block;
padding: 0.95rem 1rem;
border: 1px solid var(--border);
border-radius: 10px;
background: var(--card-bg);
color: var(--fg);
text-decoration: none;
font-weight: 600;
font-size: 1.05rem;
transition: border-color 0.15s ease, color 0.15s ease;
}

.start-link:hover,
.start-link:active {
border-color: var(--accent);
color: var(--accent);
}

.start-footer {
margin-top: 2.5rem;
font-size: 0.8rem;
color: var(--muted);
}

.start-footer a {
color: var(--muted);
}

.start-footer a:hover {

}
