name: Organize posts

# Moves posts into _posts/YYYY/MM/ and pads dates in file names.
# Runs when a post is added straight into _posts/, and by hand from the Actions tab.
on:
  push:
    paths:
      - '_posts/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/organize_posts.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Organize posts into year and month folders"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
